name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build CipAdminCenter.sln -c Release
      - run: dotnet test CipAdminCenter.sln -c Release --no-build
        env:
          CIP_TEST_POSTGRES: Host=localhost;Username=postgres;Password=ci-only-password

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/cip-admin-center-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/cip-admin-center-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
