# Local development stack: PostgreSQL + API + web scaffold.
# Copy .env.example to .env and set POSTGRES_PASSWORD before starting.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cip_admin_center}
      POSTGRES_USER: ${POSTGRES_USER:-cip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/CipAdminCenter.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: Host=db;Port=5432;Database=${POSTGRES_DB:-cip_admin_center};Username=${POSTGRES_USER:-cip};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "8080:8080"

  web:
    build:
      context: web/cip-admin-center-web
      args:
        CIP_API_BASE_URL: http://api:8080
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  db-data:
